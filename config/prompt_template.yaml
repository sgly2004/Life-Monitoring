template: '你是一名经验丰富的医学专家，请基于以下多模态健康分析结果，对患者进行综合评估并判断预期生存期。


  ## 患者基本信息

  - 实际年龄：{{ age }} 岁

  {% if faceage is defined and faceage.ok %}


  ## 面部生物年龄评估（FaceAge）

  年龄差作为定性指标，可以作为剩余寿命的判定依据。健康人群的年龄差在 0.35 岁左右，癌症、吸烟等等人群，年龄差会显著上升。

  - {{ faceage.summary }}

  - 生物年龄：**{{ faceage.outputs.biological_age }} 岁**

  - 与实际年龄差：{{ faceage.outputs.biological_age - age }} 岁（正值表示生物年龄偏大）

  {% endif %}

  {% if facettd is defined and facettd.ok %}


  ## 面部死亡时间预测（FaceTTD）

  - {{ facettd.summary }}

  - 预测剩余寿命：**{{ facettd.outputs.time_to_death_years }} 年**

  - 预期寿命：**{{ facettd.outputs.life_expectancy_age }} 岁**

  {% endif %}

  {% if parkinsons is defined and parkinsons.ok %}


  ## 帕金森病声学检测（Parkinsons）

  - {{ parkinsons.summary }}

  - 诊断结果：**{{ parkinsons.outputs.diagnosis }}**

  - 帕金森概率：{{ "%.1f"|format(parkinsons.outputs.prob_parkinson * 100) }}%

  - 风险等级：**{{ parkinsons.outputs.risk_level }}**

  {% endif %}

  {% if lung_cancer is defined and lung_cancer.ok %}


  ## 早期肺癌语音检测（Lung Cancer）

  - {{ lung_cancer.summary }}

  - 最终判断：**{{ lung_cancer.outputs.final_verdict }}**

  - 模型投票：{{ lung_cancer.outputs.votes_positive }}/{{ lung_cancer.outputs.total_models }} 个模型阳性

  {% endif %}

  {% if skin_disease is defined and skin_disease.ok %}


  ## 皮肤病检测（SkinDisease）

  - {{ skin_disease.summary }}

  - 诊断结果：**{{ skin_disease.outputs.diagnosis }}**

  - 置信度：{{ "%.1f"|format(skin_disease.outputs.confidence * 100) }}%

  - 严重程度：**{{ skin_disease.outputs.severity }}**

  - 建议：{{ skin_disease.outputs.urgency }}

  {% endif %}

  {% if mental_health is defined and mental_health.ok %}


  ## 心理状态检测（MentalHealth）

  - {{ mental_health.summary }}

  - 主导情绪：**{{ mental_health.outputs.dominant_emotion }}**（置信度 {{ "%.1f"|format(mental_health.outputs.dominant_probability * 100) }}%）

  - 心理健康评分：**{{ mental_health.outputs.mental_health_score }}/100**（{{ mental_health.outputs.mental_health_risk }}）

  - 情绪状态：**{{ mental_health.outputs.mental_state }}**

  {% endif %}


  ## 分析任务


  请综合以上所有模态的检测结果，考虑：

  1. 各项指标的异常程度和风险等级

  2. 多项检测结果的综合关联与相互印证

  3. 该患者可能的疾病进展方向与速度

  4. 心理健康状态对整体健康评估的影响


  请给出：

  - **预期生存期判断**（给出合理范围，说明置信度）

  - **关键风险因素排序**'
