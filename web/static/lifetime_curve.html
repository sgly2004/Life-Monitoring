<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>寿命曲线 — Life Monitoring</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px; color: #1a1a1a; background: #f0f2f5;
      height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }

    /* ── header ── */
    .hdr {
      display: flex; align-items: center; gap: 10px;
      padding: 0 20px; height: 52px; background: #fff;
      border-bottom: 1px solid #e5e7eb; flex-shrink: 0;
    }
    .hdr-logo { font-size: 20px; }
    .hdr-title { font-size: 15px; font-weight: 700; }
    .hdr-sub { font-size: 12px; color: #9ca3af; margin-left: 4px; }
    .hdr-links { margin-left: auto; display: flex; gap: 16px; }
    .hdr-links a { font-size: 12px; color: #6b7280; text-decoration: none; }
    .hdr-links a:hover { color: #3b82f6; }

    /* ── layout ── */
    .layout { display: flex; flex: 1; min-height: 0; }

    /* ── sidebar ── */
    .sidebar {
      width: 230px; flex-shrink: 0;
      background: #fff; border-right: 1px solid #e5e7eb;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .sidebar-hd {
      padding: 14px 14px 10px; font-size: 11px; font-weight: 700;
      color: #9ca3af; text-transform: uppercase; letter-spacing: .06em;
      border-bottom: 1px solid #f3f4f6; flex-shrink: 0;
    }
    .subject-list { flex: 1; overflow-y: auto; padding: 6px 8px; }
    .subject-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 8px; border-radius: 8px; cursor: pointer;
      transition: background .12s;
    }
    .subject-item:hover { background: #f3f4f6; }
    .subject-item.active { background: #eff6ff; }
    .subject-avatar {
      width: 38px; height: 38px; border-radius: 50%; object-fit: cover;
      border: 2px solid #e5e7eb; flex-shrink: 0; background: #f3f4f6;
    }
    .subject-avatar.placeholder {
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; background: #f3f4f6;
    }
    .subject-info { min-width: 0; }
    .subject-name { font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .subject-dob { font-size: 11px; color: #9ca3af; margin-top: 1px; }
    .subject-cnt { font-size: 11px; color: #3b82f6; margin-top: 1px; }

    .sidebar-ft { padding: 10px 8px; border-top: 1px solid #f3f4f6; flex-shrink: 0; }
    .btn-new-subject {
      width: 100%; padding: 8px 10px;
      background: none; border: 1px dashed #d1d5db; border-radius: 8px;
      color: #6b7280; font-size: 13px; cursor: pointer; text-align: center;
    }
    .btn-new-subject:hover { border-color: #3b82f6; color: #3b82f6; background: #eff6ff; }

    /* ── new subject drawer (shown below button when active) ── */
    .new-subject-form {
      padding: 10px 8px; background: #f9fafb;
      border-top: 1px solid #e5e7eb; display: none;
    }
    .new-subject-form.open { display: block; }
    .nsf-field { margin-bottom: 8px; }
    .nsf-field label {
      display: block; font-size: 10px; font-weight: 700; color: #9ca3af;
      text-transform: uppercase; letter-spacing: .05em; margin-bottom: 3px;
    }
    .nsf-field input[type="text"],
    .nsf-field input[type="date"] {
      width: 100%; padding: 6px 8px;
      border: 1px solid #e5e7eb; border-radius: 6px; font-size: 12px; background: #fff;
    }
    .nsf-field input[type="file"] {
      width: 100%; font-size: 11px; cursor: pointer;
    }
    .btn-create {
      width: 100%; padding: 7px;
      background: #3b82f6; color: #fff; border: none; border-radius: 6px;
      font-size: 12px; font-weight: 700; cursor: pointer; margin-top: 4px;
    }
    .btn-create:disabled { opacity: .55; cursor: not-allowed; }
    .btn-cancel-new { width: 100%; padding: 5px; background: none; border: none; color: #9ca3af; font-size: 11px; cursor: pointer; margin-top: 2px; }

    /* ── main area ── */
    .main { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 20px; }

    /* empty state */
    .empty-msg {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; color: #9ca3af; text-align: center; gap: 8px;
      padding: 60px 0;
    }
    .empty-msg .icon { font-size: 52px; }
    .empty-msg h2 { font-size: 16px; color: #6b7280; font-weight: 700; }
    .empty-msg p { font-size: 13px; max-width: 280px; }

    /* card */
    .card {
      background: #fff; border: 1px solid #e5e7eb; border-radius: 12px;
      padding: 18px 20px;
    }
    .card-title {
      font-size: 13px; font-weight: 700; color: #374151;
      display: flex; align-items: center; gap: 8px; margin-bottom: 16px;
    }
    .card-title .num {
      width: 22px; height: 22px; border-radius: 50%; background: #3b82f6; color: #fff;
      font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    }

    /* profile card */
    .profile-card {
      display: flex; align-items: center; gap: 16px;
    }
    .profile-photo {
      width: 72px; height: 72px; border-radius: 12px; object-fit: cover;
      border: 2px solid #e5e7eb; flex-shrink: 0; background: #f3f4f6;
    }
    .profile-photo.placeholder { display: flex; align-items: center; justify-content: center; font-size: 32px; }
    .profile-name { font-size: 20px; font-weight: 800; }
    .profile-dob { font-size: 13px; color: #6b7280; margin-top: 3px; }
    .profile-samples { font-size: 12px; color: #3b82f6; margin-top: 3px; }

    /* fields */
    .fld { margin-bottom: 12px; }
    .fld label {
      display: block; font-size: 10px; font-weight: 700; color: #9ca3af;
      text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px;
    }
    .fld input[type="date"],
    .fld input[type="number"] {
      padding: 7px 9px; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 13px;
    }
    .fld input[type="file"] {
      width: 100%; padding: 6px 8px;
      border: 1px solid #e5e7eb; border-radius: 6px; font-size: 12px; cursor: pointer;
    }

    /* video list */
    .video-list { display: flex; flex-direction: column; gap: 8px; }
    .video-row {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border: 1px solid #e5e7eb; border-radius: 8px;
      background: #f9fafb;
    }
    .video-row .vnum { font-size: 11px; font-weight: 700; color: #9ca3af; width: 50px; flex-shrink: 0; }
    .video-row .vfile { flex: 2; }
    .video-row .vfile input { width: 100%; font-size: 12px; cursor: pointer; }
    .video-row .vdate { flex: 1; }
    .video-row .vdate input {
      width: 100%; padding: 5px 7px;
      border: 1px solid #e5e7eb; border-radius: 5px; font-size: 12px;
    }
    .video-row .vremove {
      background: none; border: none; cursor: pointer; color: #d1d5db; font-size: 16px; padding: 0 2px;
    }
    .video-row .vremove:hover { color: #ef4444; }
    .btn-add-video {
      width: 100%; padding: 8px; background: none;
      border: 1px dashed #d1d5db; border-radius: 6px;
      color: #9ca3af; cursor: pointer; font-size: 12px; margin-top: 4px;
    }
    .btn-add-video:hover { border-color: #3b82f6; color: #3b82f6; }

    /* options */
    .opts { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-top: 12px; }
    .opts label { font-size: 12px; display: flex; align-items: center; gap: 5px; cursor: pointer; }
    .thr-pair { display: flex; gap: 10px; margin-left: auto; }
    .thr-f { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #6b7280; }
    .thr-f input { width: 64px; padding: 4px 6px; border: 1px solid #e5e7eb; border-radius: 5px; font-size: 12px; }

    /* submit */
    .btn-run {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 12px; margin-top: 14px;
      background: #3b82f6; color: #fff; border: none; border-radius: 8px;
      font-size: 14px; font-weight: 700; cursor: pointer; transition: opacity .15s;
    }
    .btn-run:disabled { opacity: .55; cursor: not-allowed; }
    .btn-run:not(:disabled):hover { opacity: .9; }

    /* progress panel */
    .progress-panel {
      border: 1px solid #e5e7eb; border-radius: 10px; overflow: hidden; display: none;
    }
    .progress-hd {
      background: #f9fafb; padding: 9px 14px;
      font-size: 11px; font-weight: 700; color: #6b7280;
      display: flex; align-items: center; justify-content: space-between;
    }
    .progress-body { max-height: 260px; overflow-y: auto; }
    .p-phase {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 14px; background: #eff6ff; border-top: 1px solid #e5e7eb;
      font-size: 12px; font-weight: 700; color: #1d4ed8;
    }
    .p-step {
      display: flex; align-items: flex-start; gap: 6px;
      padding: 5px 14px 5px 34px; border-top: 1px solid #f5f5f5;
      font-size: 11px; color: #6b7280; line-height: 1.55;
    }
    .p-model {
      display: flex; align-items: center; gap: 10px;
      padding: 5px 14px 5px 34px; border-top: 1px solid #f5f5f5; font-size: 11px;
    }
    .pm-label { width: 120px; flex-shrink: 0; color: #374151; font-weight: 600; }
    .pm-bar-wrap { flex: 1; height: 5px; background: #e5e7eb; border-radius: 3px; overflow: hidden; }
    .pm-bar { height: 100%; background: #3b82f6; border-radius: 3px; transition: width .25s; }
    .pm-cnt { font-size: 10px; color: #9ca3af; min-width: 46px; text-align: right; }
    .pm-tick { color: #16a34a; font-size: 12px; }

    /* status */
    .status {
      padding: 10px 14px; border-radius: 8px; font-size: 13px; display: none; align-items: center; gap: 8px;
    }
    .status.show { display: flex; }
    .status.info    { background: #eff6ff; color: #1d4ed8; }
    .status.error   { background: #fef2f2; color: #dc2626; }
    .status.success { background: #f0fdf4; color: #16a34a; }

    /* chart */
    .chart-wrap { position: relative; height: 300px; }
    .point-list { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
    .pt-card { border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px 14px; }
    .pt-meta { font-size: 11px; font-weight: 700; color: #9ca3af; margin-bottom: 5px; }
    .pt-est { font-size: 22px; font-weight: 800; color: #3b82f6; }
    .pt-range { font-size: 11px; color: #9ca3af; margin-left: 6px; }
    .pt-summary { font-size: 12px; color: #374151; margin-top: 6px; line-height: 1.65; }
    .factor-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .ftag {
      padding: 2px 7px; background: #f3f4f6; border: 1px solid #e5e7eb;
      border-radius: 10px; font-size: 10px; color: #6b7280;
    }

    /* chart empty */
    .chart-empty {
      height: 300px; display: flex; align-items: center; justify-content: center;
      color: #9ca3af; font-size: 13px; border: 1px dashed #e5e7eb; border-radius: 8px;
    }

    /* spinner */
    .spin {
      display: inline-block; width: 13px; height: 13px;
      border: 2px solid currentColor; border-top-color: transparent;
      border-radius: 50%; animation: rot .7s linear infinite; vertical-align: middle;
    }
    @keyframes rot { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- ── Header ─────────────────────────────────────────────────────────── -->
<div class="hdr">
  <span class="hdr-logo">🩺</span>
  <span class="hdr-title">Life Monitoring</span>
  <span class="hdr-sub">寿命曲线 Demo</span>
  <div class="hdr-links">
    <a href="/" target="_blank">综合分析</a>
    <a href="/preprocessing" target="_blank">数据预处理</a>
    <a href="/age-timeline" target="_blank">年龄时间线</a>
  </div>
</div>

<div class="layout">

  <!-- ── Sidebar ───────────────────────────────────────────────────────── -->
  <div class="sidebar">
    <div class="sidebar-hd">人物档案</div>
    <div class="subject-list" id="subjectList">
      <div style="padding:12px 8px;font-size:12px;color:#9ca3af">加载中…</div>
    </div>

    <div class="sidebar-ft">
      <button class="btn-new-subject" id="btnNewSubject" onclick="toggleNewForm()">＋ 新建人物</button>
      <!-- New-subject inline form -->
      <div class="new-subject-form" id="newSubjectForm">
        <div class="nsf-field">
          <label>姓名 / ID</label>
          <input type="text" id="nsfName" placeholder="张三" />
        </div>
        <div class="nsf-field">
          <label>出生日期</label>
          <input type="date" id="nsfDob" />
        </div>
        <div class="nsf-field">
          <label>锚点照片（留存用）</label>
          <input type="file" id="nsfFace" accept="image/*" />
        </div>
        <div class="nsf-field">
          <label>锚点声音（留存用）</label>
          <input type="file" id="nsfVoice" accept="audio/*,video/*" />
        </div>
        <button class="btn-create" id="btnCreate" onclick="createSubject()">创建档案</button>
        <button class="btn-cancel-new" onclick="toggleNewForm()">取消</button>
      </div>
    </div>
  </div>

  <!-- ── Main content ──────────────────────────────────────────────────── -->
  <div class="main" id="mainArea">

    <!-- empty state -->
    <div class="empty-msg" id="emptyMsg">
      <div class="icon">🧬</div>
      <h2>选择左侧人物，或新建档案</h2>
      <p>每次上传视频后会在曲线上新增一个时间点，历史点刷新后依然保留。<br>
         没有配置 LLM 也能运行，直接用 facettd 模型的估计值。</p>
    </div>

    <!-- content shown when a subject is selected -->
    <div id="subjectContent" style="display:none">

      <!-- ① Profile card -->
      <div class="card">
        <div class="card-title"><span class="num">①</span> 人物档案</div>
        <div class="profile-card">
          <img id="profilePhoto" class="profile-photo" src="" alt="anchor face"
               onerror="this.style.display='none';document.getElementById('profilePhotoPlaceholder').style.display='flex'" />
          <div id="profilePhotoPlaceholder" class="profile-photo placeholder" style="display:none">🧑</div>
          <div>
            <div class="profile-name" id="profileName">—</div>
            <div class="profile-dob" id="profileDob"></div>
            <div class="profile-samples" id="profileSamples"></div>
          </div>
        </div>
      </div>

      <!-- ② Complete profile (shown when profile is missing birth_date or anchors) -->
      <div class="card" id="completeProfileCard" style="display:none">
        <div class="card-title"><span class="num">②</span> 完善档案信息</div>
        <div style="font-size:13px;color:#ef4444;margin-bottom:14px">
          ⚠ 该人物档案不完整（缺少出生日期或锚点文件），请补充后才能上传视频进行分析。
        </div>
        <div class="fld">
          <label>出生日期</label>
          <input type="date" id="cpDob" />
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">
          <div class="fld" style="margin-bottom:0">
            <label>锚点照片</label>
            <input type="file" id="cpFace" accept="image/*" />
          </div>
          <div class="fld" style="margin-bottom:0">
            <label>锚点声音</label>
            <input type="file" id="cpVoice" accept="audio/*,video/*" />
          </div>
        </div>
        <button class="btn-run" style="margin-top:4px" onclick="completeProfile()">
          保存档案信息
        </button>
      </div>

      <!-- ② Upload video(s) -->
      <div class="card" id="uploadCard" style="display:none">
        <div class="card-title"><span class="num">②</span> 上传视频</div>

        <div class="video-list" id="videoList"></div>
        <button class="btn-add-video" onclick="addVideoRow()">＋ 添加视频</button>

        <div class="opts">
          <label>
            <input type="checkbox" id="includeSkin" />
            含皮肤病检测（较慢）
          </label>
          <div class="thr-pair">
            <div class="thr-f">
              <span>人脸阈值</span>
              <input type="number" id="faceThreshold" value="0.70" min="0" max="1" step="0.05" />
            </div>
            <div class="thr-f">
              <span>声纹阈值</span>
              <input type="number" id="voiceThreshold" value="0.75" min="0" max="1" step="0.05" />
            </div>
          </div>
        </div>

        <button class="btn-run" id="runBtn" onclick="runAnalysis()">
          <span id="runIcon">▶</span>
          <span id="runText">开始分析</span>
        </button>
      </div><!-- /uploadCard -->

      <!-- Progress panel -->
      <div class="progress-panel" id="progressPanel">
        <div class="progress-hd">
          <span>📊 处理进展</span>
          <span id="progressSummary" style="font-weight:400;color:#9ca3af"></span>
        </div>
        <div class="progress-body" id="progressBody"></div>
      </div>

      <!-- Status bar -->
      <div class="status" id="statusBar"></div>

      <!-- ③ Lifetime curve -->
      <div class="card">
        <div class="card-title">
          <span class="num">③</span> 剩余寿命预测曲线
          <span id="resultLabel" style="font-size:12px;font-weight:600;color:#3b82f6;margin-left:auto"></span>
        </div>
        <div class="chart-empty" id="chartEmpty">暂无数据 — 完成分析后曲线将显示在此处</div>
        <div id="chartArea" style="display:none">
          <div class="chart-wrap"><canvas id="lifetimeChart"></canvas></div>
          <div class="point-list" id="pointList"></div>
        </div>
      </div>

    </div><!-- /subjectContent -->
  </div><!-- /main -->
</div><!-- /layout -->

<script>
// ─── state ────────────────────────────────────────────────────────────────
let subjects = [];          // [{subject_name, birth_date, sample_count, ...}]
let currentSubject = null;  // selected subject object
let videoRowCount = 0;
let chart = null;
const modelState = {};

// ─── boot ─────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  loadSubjects();
  addVideoRow();
});

// ─── subjects ─────────────────────────────────────────────────────────────
async function loadSubjects() {
  try {
    const r = await fetch('/api/workflow/subjects');
    const data = await r.json();
    subjects = data.subjects || [];
    renderSidebar();
  } catch (_) {
    document.getElementById('subjectList').innerHTML =
      '<div style="padding:8px;font-size:12px;color:#ef4444">加载失败</div>';
  }
}

function renderSidebar() {
  const list = document.getElementById('subjectList');
  if (!subjects.length) {
    list.innerHTML = '<div style="padding:12px 8px;font-size:12px;color:#9ca3af">暂无档案，点击下方新建</div>';
    return;
  }
  // Use data attributes + delegated click to avoid double-quote nesting in onclick
  list.innerHTML = subjects.map(s => `
    <div class="subject-item ${currentSubject?.subject_name === s.subject_name ? 'active' : ''}"
         data-name="${esc(s.subject_name)}">
      <img class="subject-avatar" src="/api/workflow/subjects/${encodeURIComponent(s.subject_name)}/anchor-face"
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />
      <div class="subject-avatar placeholder" style="display:none">🧑</div>
      <div class="subject-info">
        <div class="subject-name">${esc(s.subject_name)}</div>
        <div class="subject-dob">${s.birth_date ? 'DOB ' + s.birth_date : '⚠ 无出生日期'}</div>
        <div class="subject-cnt">${s.sample_count} 次采样</div>
      </div>
    </div>
  `).join('');
  // Attach click handlers via JS (avoids HTML attribute quoting issues)
  list.querySelectorAll('.subject-item').forEach(el => {
    el.addEventListener('click', () => selectSubject(el.dataset.name));
  });
}

async function selectSubject(name) {
  const s = subjects.find(x => x.subject_name === name);
  if (!s) return;
  currentSubject = s;
  renderSidebar();
  showSubjectContent(s);

  // Load persisted timeline if available
  try {
    const r = await fetch(`/api/workflow/timeline/${encodeURIComponent(name)}`);
    if (r.ok) {
      const data = await r.json();
      if (data.points?.length) renderChart(data.points);
    }
  } catch (_) {}
}

function showSubjectContent(s) {
  document.getElementById('emptyMsg').style.display = 'none';
  document.getElementById('subjectContent').style.display = '';
  document.getElementById('profileName').textContent = s.subject_name;
  document.getElementById('profileDob').textContent = s.birth_date
    ? '出生：' + s.birth_date : '未记录出生日期';
  document.getElementById('profileSamples').textContent = `已采样 ${s.sample_count} 次`;

  const photo = document.getElementById('profilePhoto');
  const placeholder = document.getElementById('profilePhotoPlaceholder');
  // Only set src when there is actually an anchor face stored
  if (s.has_anchor_face) {
    photo.src = `/api/workflow/subjects/${encodeURIComponent(s.subject_name)}/anchor-face?t=${Date.now()}`;
    photo.style.display = '';
    placeholder.style.display = 'none';
  } else {
    photo.style.display = 'none';
    placeholder.style.display = 'flex';
  }

  document.getElementById('resultLabel').textContent = s.subject_name;

  // If profile is incomplete, show a warning + fill-in form instead of video upload
  const incomplete = !s.birth_date || !s.has_anchor_face || !s.has_anchor_voice;
  document.getElementById('completeProfileCard').style.display = incomplete ? '' : 'none';
  document.getElementById('uploadCard').style.display = incomplete ? 'none' : '';

  // Reset chart to empty state if no samples yet
  if (s.sample_count === 0) {
    document.getElementById('chartEmpty').style.display = '';
    document.getElementById('chartArea').style.display = 'none';
  }
}

// ─── new subject form ──────────────────────────────────────────────────────
let newFormOpen = false;
function toggleNewForm() {
  newFormOpen = !newFormOpen;
  document.getElementById('newSubjectForm').classList.toggle('open', newFormOpen);
}

async function createSubject() {
  const name  = document.getElementById('nsfName').value.trim();
  const dob   = document.getElementById('nsfDob').value;
  const face  = document.getElementById('nsfFace').files[0];
  const voice = document.getElementById('nsfVoice').files[0];

  if (!name)  return alert('请填写姓名 / ID');
  if (!dob)   return alert('请填写出生日期');
  if (!face)  return alert('请上传锚点照片');
  if (!voice) return alert('请上传锚点声音');

  const btn = document.getElementById('btnCreate');
  btn.disabled = true;
  btn.textContent = '创建中…';

  const fd = new FormData();
  fd.append('subject_name', name);
  fd.append('birth_date', dob);
  fd.append('anchor_face', face);
  fd.append('anchor_voice', voice);

  try {
    const r = await fetch('/api/workflow/subjects', { method: 'POST', body: fd });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || `HTTP ${r.status}`);

    // Reset form
    document.getElementById('nsfName').value = '';
    document.getElementById('nsfDob').value = '';
    document.getElementById('nsfFace').value = '';
    document.getElementById('nsfVoice').value = '';
    toggleNewForm();

    // Refresh list and select new subject
    await loadSubjects();
    selectSubject(name);
  } catch (e) {
    alert('创建失败：' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '创建档案';
  }
}

// ─── complete existing profile ────────────────────────────────────────────
async function completeProfile() {
  if (!currentSubject) return;
  const dob   = document.getElementById('cpDob').value;
  const face  = document.getElementById('cpFace').files[0];
  const voice = document.getElementById('cpVoice').files[0];

  if (!dob)   return alert('请填写出生日期');
  if (!face && !currentSubject.has_anchor_face)  return alert('请上传锚点照片');
  if (!voice && !currentSubject.has_anchor_voice) return alert('请上传锚点声音');

  const fd = new FormData();
  fd.append('subject_name', currentSubject.subject_name);
  fd.append('birth_date', dob);
  // If no new file provided, re-fetch and re-post existing (server just overwrites)
  if (face) fd.append('anchor_face', face);
  else {
    // Fetch existing anchor face and re-attach
    const blob = await fetch(`/api/workflow/subjects/${encodeURIComponent(currentSubject.subject_name)}/anchor-face`)
      .then(r => r.blob()).catch(() => null);
    if (!blob) return alert('无法获取已有锚点照片，请重新上传');
    fd.append('anchor_face', blob, 'anchor_face.jpg');
  }
  if (voice) fd.append('anchor_voice', voice);
  else {
    return alert('请上传锚点声音文件');
  }

  try {
    const r = await fetch('/api/workflow/subjects', { method: 'POST', body: fd });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || `HTTP ${r.status}`);
    await loadSubjects();
    selectSubject(currentSubject.subject_name);
  } catch (e) {
    alert('保存失败：' + e.message);
  }
}

// ─── video rows ────────────────────────────────────────────────────────────
function addVideoRow() {
  videoRowCount++;
  const id = videoRowCount;
  const row = document.createElement('div');
  row.className = 'video-row';
  row.dataset.id = id;
  row.innerHTML = `
    <span class="vnum">视频 #${id}</span>
    <div class="vfile"><input type="file" id="vf_${id}" accept="video/*" /></div>
    <div class="vdate"><input type="date" id="vd_${id}" value="${todayStr()}" /></div>
    <button class="vremove" onclick="removeVideoRow(${id})" title="移除">✕</button>
  `;
  document.getElementById('videoList').appendChild(row);
}

function removeVideoRow(id) {
  document.querySelector(`.video-row[data-id="${id}"]`)?.remove();
}

function todayStr() { return new Date().toISOString().slice(0, 10); }

function collectVideos() {
  return [...document.querySelectorAll('.video-row')].map(el => {
    const id = el.dataset.id;
    return {
      file: document.getElementById(`vf_${id}`)?.files[0],
      date: document.getElementById(`vd_${id}`)?.value,
    };
  }).filter(v => v.file);
}

// ─── analysis ─────────────────────────────────────────────────────────────
function validate() {
  if (!currentSubject) return '请先在左侧选择人物';
  if (!currentSubject.birth_date || !currentSubject.has_anchor_face || !currentSubject.has_anchor_voice)
    return '请先完善上方的档案信息（出生日期 + 锚点照片 + 锚点声音）';
  const videos = collectVideos();
  if (!videos.length) return '请至少添加一条视频文件';
  for (const v of videos) if (!v.date) return '视频缺少拍摄日期';
  return null;
}

async function runAnalysis() {
  const err = validate();
  if (err) { showStatus('error', err); return; }

  setRunning(true);
  clearProgressPanel();
  showProgressPanel(true);
  showStatus('info', '<span class="spin"></span> 连接服务器…');

  const fd = new FormData();
  fd.append('subject_name', currentSubject.subject_name);
  fd.append('birth_date', currentSubject.birth_date);
  fd.append('include_skin_disease', document.getElementById('includeSkin').checked);
  fd.append('face_threshold', document.getElementById('faceThreshold').value);
  fd.append('voice_threshold', document.getElementById('voiceThreshold').value);

  for (const v of collectVideos()) {
    fd.append('videos', v.file);
    fd.append('dates', v.date);
  }

  try {
    const response = await fetch('/api/workflow/analyze-stream', { method: 'POST', body: fd });
    if (!response.ok) {
      const d = await response.json().catch(() => ({}));
      throw new Error(d.detail || `HTTP ${response.status}`);
    }
    showStatus('info', '<span class="spin"></span> 处理中，请耐心等待…');
    await consumeSSE(response.body);
  } catch (e) {
    showStatus('error', '❌ ' + e.message);
  } finally {
    setRunning(false);
  }
}

async function consumeSSE(body) {
  const reader = body.getReader();
  const decoder = new TextDecoder();
  let buf = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    const chunks = buf.split('\n\n');
    buf = chunks.pop();
    for (const chunk of chunks) {
      const em = chunk.match(/^event:\s*(.+)$/m);
      const dm = chunk.match(/^data:\s*(.+)$/ms);
      if (!dm) continue;
      const type = em ? em[1].trim() : 'message';
      let data; try { data = JSON.parse(dm[1].trim()); } catch (_) { continue; }
      handleEvent(type, data);
    }
  }
  setRunning(false);
}

function handleEvent(type, data) {
  if (type === 'phase') {
    addPhaseRow(data.desc || data.phase);
    document.getElementById('progressSummary').textContent = data.desc || '';
  } else if (type === 'step') {
    addStepRow(data.desc || data.step);
  } else if (type === 'model_progress') {
    updateModelBar(data);
  } else if (type === 'done') {
    renderChart(data.points || []);
    showStatus('success', `✓ 分析完成，共 ${(data.points || []).length} 个时间点`);
    // Update sample count in sidebar
    const s = subjects.find(x => x.subject_name === data.subject_name);
    if (s) s.sample_count = (data.points || []).length;
    renderSidebar();
    if (currentSubject) currentSubject.sample_count = (data.points || []).length;
    document.getElementById('profileSamples').textContent = `已采样 ${currentSubject?.sample_count} 次`;
  } else if (type === 'error') {
    showStatus('error', '❌ ' + (data.detail || '未知错误'));
  }
}

// ─── progress panel ────────────────────────────────────────────────────────
function showProgressPanel(on) {
  document.getElementById('progressPanel').style.display = on ? '' : 'none';
}
function clearProgressPanel() {
  document.getElementById('progressBody').innerHTML = '';
  Object.keys(modelState).forEach(k => delete modelState[k]);
}
function addPhaseRow(text) {
  const d = document.createElement('div');
  d.className = 'p-phase';
  d.innerHTML = `<span class="spin" style="flex-shrink:0"></span><span>${esc(text)}</span>`;
  document.getElementById('progressBody').appendChild(d);
  scrollPB();
}
function addStepRow(text) {
  const d = document.createElement('div');
  d.className = 'p-step';
  d.innerHTML = `<span style="color:#d1d5db;margin-top:1px">›</span><span>${esc(text)}</span>`;
  document.getElementById('progressBody').appendChild(d);
  scrollPB();
}
function updateModelBar(data) {
  const model = data.model;
  const cur = data.current || 0, tot = data.total || 1;
  const pct = tot > 0 ? Math.round(cur / tot * 100) : 100;
  if (!modelState[model]) {
    const labels = {
      faceage: 'FaceAge（生物年龄）', facettd: 'facettd（寿命预测）',
      parkinsons: 'Parkinsons', lung_cancer: 'LungCancer', skin_disease: 'SkinDisease',
    };
    const row = document.createElement('div');
    row.className = 'p-model'; row.id = `pmr_${model}`;
    row.innerHTML = `
      <span class="pm-label">${labels[model] || model}</span>
      <div class="pm-bar-wrap"><div class="pm-bar" id="pmb_${model}" style="width:0%"></div></div>
      <span class="pm-cnt" id="pmc_${model}"></span>
      <span id="pmt_${model}"></span>
    `;
    document.getElementById('progressBody').appendChild(row);
    modelState[model] = true;
    scrollPB();
  }
  const bar = document.getElementById(`pmb_${model}`);
  const cnt = document.getElementById(`pmc_${model}`);
  const tick = document.getElementById(`pmt_${model}`);
  if (bar) bar.style.width = pct + '%';
  if (cnt) cnt.textContent = tot > 1 ? `${cur}/${tot}` : (data.value ?? '');
  if (data.done && tick) {
    tick.className = 'pm-tick'; tick.textContent = '✓';
    if (bar) bar.style.background = '#16a34a';
  }
}
function scrollPB() {
  const b = document.getElementById('progressBody');
  b.scrollTop = b.scrollHeight;
}

// ─── chart ─────────────────────────────────────────────────────────────────
function renderChart(points) {
  document.getElementById('chartEmpty').style.display = 'none';
  document.getElementById('chartArea').style.display = '';

  if (chart) { chart.destroy(); chart = null; }
  const labels = points.map(p => p.captured_at.slice(0, 10));
  const ests   = points.map(p => p.remaining_life_estimate >= 0 ? p.remaining_life_estimate : null);
  const lows   = points.map(p => p.uncertainty_low);
  const highs  = points.map(p => p.uncertainty_high);

  chart = new Chart(document.getElementById('lifetimeChart').getContext('2d'), {
    type: 'line',
    data: {
      labels,
      datasets: [
        { label: '剩余寿命估计（年）', data: ests,
          borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,0.07)',
          pointRadius: 5, pointBackgroundColor: '#3b82f6',
          tension: 0.35, fill: false, order: 1 },
        { label: '上界', data: highs,
          borderColor: 'rgba(156,163,175,.4)', backgroundColor: 'rgba(156,163,175,.07)',
          pointRadius: 0, borderDash: [5,4], fill: '+1', tension: 0.35, order: 2 },
        { label: '下界', data: lows,
          borderColor: 'rgba(156,163,175,.4)', backgroundColor: 'rgba(156,163,175,.07)',
          pointRadius: 0, borderDash: [5,4], fill: false, tension: 0.35, order: 3 },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { labels: { boxWidth: 11, font: { size: 11 } } },
        tooltip: { callbacks: {
          label: ctx => {
            const pt = points[ctx.dataIndex];
            if (!pt) return '';
            const e = pt.remaining_life_estimate >= 0 ? pt.remaining_life_estimate.toFixed(1) : '—';
            return `估计 ${e} 年  [${pt.uncertainty_low.toFixed(1)} – ${pt.uncertainty_high.toFixed(1)}]`;
          }
        }},
      },
      scales: {
        x: { title: { display: true, text: '拍摄日期' } },
        y: { title: { display: true, text: '剩余寿命（年）' }, beginAtZero: true },
      },
    },
  });

  const list = document.getElementById('pointList');
  list.innerHTML = '';
  for (const pt of points) {
    const e = pt.remaining_life_estimate >= 0 ? pt.remaining_life_estimate.toFixed(1) : '—';
    const tags = (pt.key_factors || []).map(f => `<span class="ftag">${esc(f)}</span>`).join('');
    const card = document.createElement('div');
    card.className = 'pt-card';
    card.innerHTML = `
      <div class="pt-meta">${pt.captured_at.slice(0,10)}（时年 ${pt.age_at_capture} 岁）</div>
      <div><span class="pt-est">${e} 年</span>
           <span class="pt-range">[${pt.uncertainty_low.toFixed(1)} – ${pt.uncertainty_high.toFixed(1)}]</span></div>
      ${pt.summary ? `<div class="pt-summary">${esc(pt.summary)}</div>` : ''}
      ${tags ? `<div class="factor-tags">${tags}</div>` : ''}
    `;
    list.appendChild(card);
  }
}

// ─── helpers ───────────────────────────────────────────────────────────────
function setRunning(on) {
  const btn = document.getElementById('runBtn');
  btn.disabled = on;
  document.getElementById('runIcon').innerHTML = on ? '<span class="spin"></span>' : '▶';
  document.getElementById('runText').textContent = on ? '分析中…' : '开始分析';
}
function showStatus(type, msg) {
  const bar = document.getElementById('statusBar');
  bar.className = 'status show ' + type;
  bar.innerHTML = msg;
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])
  );
}
